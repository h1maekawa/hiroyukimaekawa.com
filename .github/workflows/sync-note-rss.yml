name: Sync note RSS

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-note-rss
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTE_RSS_URL: ${{ vars.NOTE_RSS_URL || 'https://note.com/mae_chan1/rss' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync:note
      - run: npm run build
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/note-posts.json; then
            echo "No note updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/note-posts.json
          git commit -m "chore: sync note posts"
          git push origin HEAD:main
