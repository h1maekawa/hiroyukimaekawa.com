name: Sync note RSS

on:
  # noteにはwebhookがないので、こちらから定期的にRSSを見に行く。
  # 1時間ごと（記事が増えていなければ何もコミットしないので空振りは安い）。
  # GitHubのスケジュール実行は混雑時に数分〜十数分遅れることがある。
  # すぐ反映したいときは Actions から手動実行する（workflow_dispatch）。
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-note-rss
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTE_RSS_URL: ${{ vars.NOTE_RSS_URL || 'https://note.com/maemichi/rss' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RSSの取り込みに関わるテストだけを走らせる。
      # ここで `npm test` を全部回すと、記事の同期とは無関係なテストが落ちただけで
      # 記事の更新まで止まってしまう。サイト全体のテストは ci.yml が見る。
      - run: node --test test/note-rss.test.mjs
      - run: npm run sync:note
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/note-posts.json; then
            echo "No note updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/note-posts.json
          git commit -m "chore: sync note posts"
          git push origin HEAD:main
